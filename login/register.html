<!DOCTYPE html>
<html lang="en">
<head>
	<title>Register Account</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="images/icons/favicon.ico"/>
<link rel="stylesheet" type="text/css" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" type="text/css" href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" type="text/css" href="vendor/animate/animate.css">
<link rel="stylesheet" type="text/css" href="vendor/css-hamburgers/hamburgers.min.css">
<link rel="stylesheet" type="text/css" href="vendor/select2/select2.min.css">
<link rel="stylesheet" type="text/css" href="css/util.css">
	<link rel="stylesheet" type="text/css" href="css/main.css">
</head>
<body>
	
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<div class="login100-pic js-tilt" data-tilt>
					<img src="images/img-01.png" alt="IMG">
				</div>

				<form class="login100-form validate-form">
					<span class="login100-form-title">
						Daftar Akun Baru
					</span>
					
					<div class="wrap-input100 validate-input" data-validate = "Username is required">
						<input class="input100" type="text" id="regUser" name="username" placeholder="Buat Username">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-user" aria-hidden="true"></i>
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Password is required">
						<input class="input100" type="password" id="regPass" name="pass" placeholder="Buat Password">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>

					<div class="wrap-input100 validate-input" data-validate = "Confirm Password is required">
						<input class="input100" type="password" id="regConfirmPass" name="confirm_pass" placeholder="Ulangi Password">
						<span class="focus-input100"></span>
						<span class="symbol-input100">
							<i class="fa fa-lock" aria-hidden="true"></i>
						</span>
					</div>
					
					<div class="container-login100-form-btn">
						<button type="button" id="tombolRegister" class="login100-form-btn">	
							Daftar
						</button>
					</div>

					<div class="text-center p-t-136">
						<a class="txt2" href="index.html">
							Sudah punya akun? Login disini
							<i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
						</a>
					</div>
				 <p id="message"></p>
				</form>
			</div>
		</div>
	</div>

<script src="vendor/jquery/jquery-3.2.1.min.js"></script>
<script src="vendor/bootstrap/js/popper.js"></script>
	<script src="vendor/bootstrap/js/bootstrap.min.js"></script>
<script src="vendor/select2/select2.min.js"></script>
<script src="vendor/tilt/tilt.jquery.min.js"></script>
	<script >
		$('.js-tilt').tilt({
			scale: 1.1
		})
	</script>
<script src="js/register.js"></script>

<script>
    // Ambil elemen tombol register
    const btnRegister = document.getElementById('tombolRegister');

    btnRegister.addEventListener('click', function() {
        var u = document.getElementById('regUser').value.trim();
        var p = document.getElementById('regPass').value.trim();
        var cp = document.getElementById('regConfirmPass').value.trim();
        
        // 1. Validasi jika ada field yang kosong
        if (u === '' || p === '' || cp === '') {
            alert('Semua kolom pendaftaran wajib diisi!');
            return;
        }

        // 2. Validasi apakah password dan konfirmasi cocok
        if (p !== cp) {
            alert('Password tidak cocok! Tolong periksa kembali.');
            return;
        }

        // 3. Simpan data akun baru ke localStorage browser
        localStorage.setItem('registeredUser', u);
        localStorage.setItem('registeredPass', p);

        alert('Pendaftaran berhasil! Silahkan login dengan akun baru Anda.');
        
        // 4. Arahkan otomatis ke halaman login (index.html di folder login itu)
        window.location.href = 'index.html';
    });
</script>			
</body>
</html>
